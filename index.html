    /* 3D Paper Cup Graphics */

<body>

  <!-- Winner Modal -->
  <div class="modal-backdrop" id="winModal">
    <div class="modal-box">
      <div style="font-size:2.5rem; margin-bottom:8px;" id="winEmoji">🏆</div>

      <div style="display:flex; flex-direction:column; gap:8px; width:100%; margin-top:8px;">
        <button class="btn-reset" style="width:100%;" id="winRestartBtn" onclick="closeModalAndReset()">もう一度遊ぶ</button>
        <button class="btn-action" style="width:100%; background:#fef3c7; color:#78350f; border:1px solid #fde68a;" onclick="closeModalAndReturnToOpening()">🏠 オープニング画面に戻る</button>
      </div>
    </div>

  <script>
    // --- 1. Audio Sound Effects (Web Audio API Synthesizer) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'select') {
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'place') {
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(freq, now + idx * 0.1);
            g.gain.setValueAtTime(0.18, now + idx * 0.1);
            g.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
            o.start(now + idx * 0.1);
            o.stop(now + idx * 0.1 + 0.25);
          });
        } else if (type === 'lose') {
          const steps = [
            { f: 349.23, d: 0.22, delay: 0 },
            { f: 311.13, d: 0.22, delay: 0.2 },
            { f: 277.18, d: 0.25, delay: 0.4 },
            { f: 220.00, d: 0.60, delay: 0.62, drop: 146.83 }
          ];
          steps.forEach(s => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'sawtooth';
            const st = now + s.delay;
            o.frequency.setValueAtTime(s.f, st);
            if (s.drop) o.frequency.exponentialRampToValueAtTime(s.drop, st + s.d);
            g.gain.setValueAtTime(0.13, st);
            g.gain.linearRampToValueAtTime(0.001, st + s.d);
            o.start(st);
            o.stop(st + s.d);
          });
        }
      } catch (e) {}
    }

    // --- 2. Game Logic & Rules ---
    const WINNING_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let gameState = {
      board: [[], [], [], [], [], [], [], [], []],
      hand: {
        1: [
          { id: 'p1-s1', player: 1, size: 1 }, { id: 'p1-s2', player: 1, size: 1 },
          { id: 'p1-m1', player: 1, size: 2 }, { id: 'p1-m2', player: 1, size: 2 },
          { id: 'p1-l1', player: 1, size: 3 }, { id: 'p1-l2', player: 1, size: 3 }
        ],
        2: [
          { id: 'p2-s1', player: 2, size: 1 }, { id: 'p2-s2', player: 2, size: 1 },
          { id: 'p2-m1', player: 2, size: 2 }, { id: 'p2-m2', player: 2, size: 2 },
          { id: 'p2-l1', player: 2, size: 3 }, { id: 'p2-l2', player: 2, size: 3 }
        ]
      },
      currentTurn: 1,
      winner: null,
      winningLine: null
    };

    let selectedPiece = null; // { source: 'hand'|'board', piece, fromIndex? }
    let gameMode = 'ai'; // 'ai' | 'local' | 'p2p'
    let openingSelectedMode = 'ai';
    let p2pPeer = null;
    let p2pConn = null;
    let p2pRole = null; // 'host' (player 1) | 'guest' (player 2)
    let myRoomId = '';

    function setOpeningMode(m) {
      openingSelectedMode = m;
      document.getElementById('openModeAi').classList.toggle('active', m === 'ai');
      document.getElementById('openModeLocal').classList.toggle('active', m === 'local');
      document.getElementById('openModeP2p').classList.toggle('active', m === 'p2p');
    }

    function startGameFromOpening() {
      document.getElementById('openingScreen').style.display = 'none';
      switchMode(openingSelectedMode);
      resetGame();
    }

    function returnToOpening() {
      document.getElementById('openingScreen').style.display = 'flex';
    }

    function getTopPiece(cell) {
      if (!cell || cell.length === 0) return null;
      return cell[cell.length - 1];
    }

    function canPlace(piece, cell) {
      const top = getTopPiece(cell);
      if (!top) return true;
      return piece.size > top.size;
    }

    function evaluateBoardLines(board) {
      const p1 = [];
      const p2 = [];
      for (const line of WINNING_LINES) {
        const [a, b, c] = line;
        const topA = getTopPiece(board[a]);
        const topB = getTopPiece(board[b]);
        const topC = getTopPiece(board[c]);
        if (topA && topB && topC) {
          if (topA.player === 1 && topB.player === 1 && topC.player === 1) p1.push(line);
          else if (topA.player === 2 && topB.player === 2 && topC.player === 2) p2.push(line);
        }
      }
      return { p1, p2 };
    }

    function checkWinner(board, activePlayer) {
      const { p1, p2 } = evaluateBoardLines(board);
      const opp = activePlayer === 1 ? 2 : 1;
      const oppLines = opp === 1 ? p1 : p2;
      const actLines = activePlayer === 1 ? p1 : p2;

      // Official rule: If uncovering exposes opponent line, opponent wins!
      if (oppLines.length > 0) return { winner: opp, winningLine: oppLines[0] };
      if (actLines.length > 0) return { winner: activePlayer, winningLine: actLines[0] };
      return { winner: null, winningLine: null };
    }

    function applyMoveAction(state, action) {
      const newBoard = state.board.map(cell => [...cell]);
      const newHand = { 1: [...state.hand[1]], 2: [...state.hand[2]] };
      let movedPiece;

      if (action.type === 'hand') {
        const idx = newHand[action.player].findIndex(p => p.id === action.pieceId);
        movedPiece = newHand[action.player].splice(idx, 1)[0];
      } else {
        movedPiece = newBoard[action.fromIndex].pop();
      }

      newBoard[action.toIndex].push(movedPiece);
      const { winner, winningLine } = checkWinner(newBoard, action.player);

      return {
        board: newBoard,
        hand: newHand,
        currentTurn: action.player === 1 ? 2 : 1,
        winner,
        winningLine
      };
    }

    function getAllValidMoves(state, player) {
      if (state.winner !== null) return [];
      const moves = [];
      const checkedSizes = new Set();

      for (const piece of state.hand[player]) {
        if (checkedSizes.has(piece.size)) continue;
        checkedSizes.add(piece.size);
        for (let toIdx = 0; toIdx < 9; toIdx++) {
          if (canPlace(piece, state.board[toIdx])) {
            moves.push({ type: 'hand', player, pieceId: piece.id, toIndex: toIdx });
          }
        }
      }

      for (let fromIdx = 0; fromIdx < 9; fromIdx++) {
        const top = getTopPiece(state.board[fromIdx]);
        if (top && top.player === player) {
          for (let toIdx = 0; toIdx < 9; toIdx++) {
            if (fromIdx !== toIdx && canPlace(top, state.board[toIdx])) {
              moves.push({ type: 'board', player, fromIndex: fromIdx, toIndex: toIdx });
            }
          }
        }
      }
      return moves;
    }

    // --- 3. Supreme AI Engine (FastEngine + Alpha-Beta 7-ply + Master Theory) ---
    const POSITION_WEIGHTS = [45, 10, 45, 10, 80, 10, 45, 10, 45];
    const fastBoard = new Uint8Array(27);
    const fastHands = new Uint8Array(12);

    function syncFastEngine(state) {
      fastBoard.fill(0);
      for (let c = 0; c < 9; c++) {
        for (const p of state.board[c]) {
          fastBoard[c * 3 + p.size - 1] = p.player;
        }
      }
      fastHands.fill(0);
      for (let p = 1; p <= 2; p++) {
        for (const piece of state.hand[p]) {
          fastHands[p * 4 + piece.size]++;
        }
      }
    }

    function fastGetTop(c) {
      const base = c * 3;
      const l = fastBoard[base + 2];
      if (l > 0) return { player: l, size: 3 };
      const m = fastBoard[base + 1];
      if (m > 0) return { player: m, size: 2 };
      const s = fastBoard[base];
      if (s > 0) return { player: s, size: 1 };
      return { player: 0, size: 0 };
    }

    function fastCheckWinner() {
      for (let i = 0; i < 8; i++) {
        const line = WINNING_LINES[i];
        const t0 = fastGetTop(line[0]);
        if (t0.player === 0) continue;
        const t1 = fastGetTop(line[1]);
        if (t1.player !== t0.player) continue;
        const t2 = fastGetTop(line[2]);
        if (t2.player === t0.player) return t0.player;
      }
      return 0;
    }

    function fastGenerateMoves(player, outMoves) {
      let count = 0;
      for (let size = 3; size >= 1; size--) {
        if (fastHands[player * 4 + size] > 0) {
          for (let to = 0; to < 9; to++) {
            if (fastGetTop(to).size < size) {
              outMoves[count++] = { from: -1, to, size };
            }
          }
        }
      }
      for (let from = 0; from < 9; from++) {
        const top = fastGetTop(from);
        if (top.player === player) {
          for (let to = 0; to < 9; to++) {
            if (to === from) continue;
            if (fastGetTop(to).size < top.size) {
              outMoves[count++] = { from, to, size: top.size };
            }
          }
        }
      }
      return count;
    }

    function fastMakeMove(player, m) {
      if (m.from === -1) {
        fastHands[player * 4 + m.size]--;
        fastBoard[m.to * 3 + m.size - 1] = player;
      } else {
        fastBoard[m.from * 3 + m.size - 1] = 0;
        fastBoard[m.to * 3 + m.size - 1] = player;
      }
    }

    function fastUnmakeMove(player, m) {
      if (m.from === -1) {
        fastHands[player * 4 + m.size]++;
        fastBoard[m.to * 3 + m.size - 1] = 0;
      } else {
        fastBoard[m.from * 3 + m.size - 1] = player;
        fastBoard[m.to * 3 + m.size - 1] = 0;
      }
    }

    function fastEvaluate(player) {
      const opp = player === 1 ? 2 : 1;
      let score = 0;
      for (let c = 0; c < 9; c++) {
        const top = fastGetTop(c);
        if (top.player === player) {
          score += POSITION_WEIGHTS[c] + (top.size === 3 ? 220 : top.size === 2 ? 90 : 30);
        } else if (top.player === opp) {
          score -= POSITION_WEIGHTS[c] + (top.size === 3 ? 220 : top.size === 2 ? 90 : 30);
        }
        const base = c * 3;
        if (top.player === player) {
          for (let sz = 0; sz < top.size - 1; sz++) {
            if (fastBoard[base + sz] === opp) score += 300 * (sz + 1);
          }
        } else if (top.player === opp) {
          for (let sz = 0; sz < top.size - 1; sz++) {
            if (fastBoard[base + sz] === player) score -= 300 * (sz + 1);
          }
        }
      }
      const myL = fastHands[player * 4 + 3];
      const oppL = fastHands[opp * 4 + 3];
      score += (myL - oppL) * 40;

      const myM = fastHands[player * 4 + 2];
      const oppM = fastHands[opp * 4 + 2];
      score += (myM - oppM) * 20;

      let myThreats = 0, oppThreats = 0;
      for (let i = 0; i < 8; i++) {
        const line = WINNING_LINES[i];
        let pCount = 0, oCount = 0, oIdx = -1, pIdx = -1;
        for (let j = 0; j < 3; j++) {
          const c = line[j];
          const top = fastGetTop(c);
          if (top.player === player) { pCount++; pIdx = c; }
          else if (top.player === opp) { oCount++; oIdx = c; }
        }
        if (pCount === 2 && oCount === 0) {
          myThreats++; score += 3500;
        } else if (pCount === 2 && oCount === 1) {
          if (myL > 0 || (myM > 0 && fastGetTop(oIdx).size === 1)) {
            myThreats++; score += 2800;
          }
        }
        if (oCount === 2 && pCount === 0) {
          oppThreats++; score -= 4500;
        } else if (oCount === 2 && pCount === 1) {
          if (oppL > 0 || (oppM > 0 && fastGetTop(pIdx).size === 1)) {
            oppThreats++; score -= 3800;
          }
        }
      }
      if (myThreats >= 2) score += 45000;
      if (oppThreats >= 2) score -= 50000;
      return score;
    }

    const fastMovePool = Array.from({ length: 25 }, () =>
      Array.from({ length: 60 }, () => ({ from: 0, to: 0, size: 0 }))
    );

    function fastAlphaBeta(depth, alpha, beta, player, maxDepth) {
      const win = fastCheckWinner();
      if (win !== 0) {
        return { score: win === player ? 500000 - (maxDepth - depth) * 1000 : -500000 + (maxDepth - depth) * 1000 };
      }
      if (depth === 0) {
        return { score: fastEvaluate(player) };
      }
      const opp = player === 1 ? 2 : 1;
      const moves = fastMovePool[depth];
      const count = fastGenerateMoves(player, moves);
      if (count === 0) return { score: fastEvaluate(player) };

      for (let i = 0; i < count; i++) {
        const m = moves[i];
        fastMakeMove(player, m);
        const postWin = fastCheckWinner();
        fastUnmakeMove(player, m);
        if (postWin === player) {
          return { score: 500000 - (maxDepth - depth) * 1000, bestMove: { ...m } };
        }
      }

      const scoredMoves = [];
      for (let i = 0; i < count; i++) {
        const m = moves[i];
        let s = 0;
        if (m.from === -1) s += 180;
        if (m.to === 4) s += 120;
        else if (m.to === 0 || m.to === 2 || m.to === 6 || m.to === 8) s += 60;
        const top = fastGetTop(m.to);
        if (top.player === opp) s += 350 + top.size * 90;
        s += m.size * 30;
        if (m.from === 4) s -= 80000;
        scoredMoves.push({ m, score: s });
      }
      scoredMoves.sort((a, b) => b.score - a.score);

      let bestVal = -Infinity;
      let bestMove = null;

      for (const item of scoredMoves) {
        const m = item.m;
        fastMakeMove(player, m);
        const postWin = fastCheckWinner();
        let val;
        if (postWin === opp) {
          val = -500000;
        } else {
          const res = fastAlphaBeta(depth - 1, -beta, -alpha, opp, maxDepth);
          val = -res.score;
          if (m.from === 4 && postWin !== player) {
            val -= 80000;
          }
        }
        fastUnmakeMove(player, m);

        if (val > bestVal) {
          bestVal = val;
          bestMove = { ...m };
        }
        if (bestVal > alpha) alpha = bestVal;
        if (alpha >= beta) break;
      }
      return { score: bestVal === -Infinity ? 0 : bestVal, bestMove };
    }

    function computeSupremeAIMove(state, aiPlayer) {
      const valid = getAllValidMoves(state, aiPlayer);
      if (valid.length === 0) return null;

      // 1. Immediate Win
      for (const m of valid) {
        if (applyMoveAction(state, m).winner === aiPlayer) return m;
      }

      // 2. Immediate Block
      const opp = aiPlayer === 1 ? 2 : 1;
      const oppWins = getAllValidMoves(state, opp).filter(m => applyMoveAction(state, m).winner === opp);
      if (oppWins.length > 0) {
        const oppHand = state.hand[opp];
        const maxOppHand = oppHand.length > 0 ? Math.max(...oppHand.map(p => p.size)) : 0;
        const blocks = [];
        for (const m of valid) {
          const next = applyMoveAction(state, m);
          if (next.winner === opp) continue;
          const remWins = getAllValidMoves(next, opp).filter(mv => applyMoveAction(next, mv).winner === opp);
          let pSize = 0, vacatesCenter = false;
          if (m.type === 'hand') {
            pSize = state.hand[aiPlayer].find(p => p.id === m.pieceId).size;
          } else {
            pSize = getTopPiece(state.board[m.fromIndex]).size;
            if (m.fromIndex === 4) vacatesCenter = true;
          }
          const isSafe = pSize > maxOppHand || pSize === 3;
          blocks.push({
            m,
            rem: remWins.length,
            isSafe,
            vacatesCenter,
            isHand: m.type === 'hand',
            size: pSize
          });
        }
        const perfect = blocks.filter(b => b.rem === 0);
        if (perfect.length > 0) {
          perfect.sort((a, b) => {
            if (a.vacatesCenter !== b.vacatesCenter) return a.vacatesCenter ? 1 : -1;
            if (a.isHand !== b.isHand) return a.isHand ? -1 : 1;
            if (a.isSafe !== b.isSafe) return a.isSafe ? -1 : 1;
            return b.size - a.size;
          });
          return perfect[0].m;
        }
      }

      // 3. Master Theory Opening
      const totalBoardPieces = state.board.reduce((acc, st) => acc + st.length, 0);
      const lPiece = state.hand[aiPlayer].find(p => p.size === 3);

      if (totalBoardPieces === 0 && lPiece && aiPlayer === 1) {
        return { type: 'hand', player: aiPlayer, pieceId: lPiece.id, toIndex: 4 };
      }
      if (totalBoardPieces === 1 && lPiece && aiPlayer === 2) {
        const topCenter = getTopPiece(state.board[4]);
        if (!topCenter || (topCenter.player === opp && topCenter.size < 3)) {
          return { type: 'hand', player: aiPlayer, pieceId: lPiece.id, toIndex: 4 };
        } else {
          return { type: 'hand', player: aiPlayer, pieceId: lPiece.id, toIndex: 0 };
        }
      }
      if (totalBoardPieces === 2 && lPiece && aiPlayer === 1) {
        let oppCorner = -1;
        for (const c of [0, 2, 6, 8]) {
          const top = getTopPiece(state.board[c]);
          if (top && top.player === opp) oppCorner = c;
        }
        if (oppCorner === 0) return { type: 'hand', player: aiPlayer, pieceId: lPiece.id, toIndex: 8 };
        if (oppCorner === 8) return { type: 'hand', player: aiPlayer, pieceId: lPiece.id, toIndex: 0 };
        if (oppCorner === 2) return { type: 'hand', player: aiPlayer, pieceId: lPiece.id, toIndex: 6 };
        if (oppCorner === 6) return { type: 'hand', player: aiPlayer, pieceId: lPiece.id, toIndex: 2 };
        const emptyCorners = [0, 2, 6, 8].filter(c => state.board[c].length === 0);
        if (emptyCorners.length > 0) {
          return { type: 'hand', player: aiPlayer, pieceId: lPiece.id, toIndex: emptyCorners[0] };
        }
      }
      if (totalBoardPieces === 3 && lPiece && aiPlayer === 2) {
        const topCenter = getTopPiece(state.board[4]);
        if (topCenter && topCenter.player === aiPlayer && topCenter.size === 3) {
          const threats = [];
          for (const line of WINNING_LINES) {
            let oppCount = 0, emptyCell = -1;
            for (const c of line) {
              const top = getTopPiece(state.board[c]);
              if (top && top.player === opp) oppCount++;
              else if (!top) emptyCell = c;
            }
            if (oppCount === 2 && emptyCell !== -1) threats.push(emptyCell);
          }
          if (threats.length > 0) {
            return { type: 'hand', player: aiPlayer, pieceId: lPiece.id, toIndex: threats[0] };
          }
          const emptyCorners = [0, 2, 6, 8].filter(c => state.board[c].length === 0);
          if (emptyCorners.length > 0) {
            return { type: 'hand', player: aiPlayer, pieceId: lPiece.id, toIndex: emptyCorners[0] };
          }
        }
      }

      // 4. Alpha-Beta 7-ply Search
      syncFastEngine(state);
      const res = fastAlphaBeta(7, -Infinity, Infinity, aiPlayer, 7);
      if (res.bestMove) {
        const m = res.bestMove;
        if (m.from === -1) {
          const piece = state.hand[aiPlayer].find(p => p.size === m.size);
          if (piece) return { type: 'hand', player: aiPlayer, pieceId: piece.id, toIndex: m.to };
        } else {
          return { type: 'board', player: aiPlayer, fromIndex: m.from, toIndex: m.to };
        }
      }
      return valid[0];
    }

    // --- 4. Render 3D Paper Cup SVG ---
    function renderCupSvg(piece, isSelected, stackCount) {
      const isP1 = piece.player === 1;
      const sizeClass = 'cup-size-' + piece.size;
      const label = piece.size === 1 ? '小' : piece.size === 2 ? '中' : '大';

      const gStart = isP1 ? '#38bdf8' : '#fb923c';
      const gMid   = isP1 ? '#0284c7' : '#ea580c';
      const gEnd   = isP1 ? '#0369a1' : '#c2410c';
      const rimCol = isP1 ? '#075985' : '#9a3412';
      const capTop = isP1 ? '#bae6fd' : '#ffedd5';
      const faceCol= isP1 ? '#082f49' : '#431407';

      const stackHtml = stackCount > 1 ? '<div class="stack-indicator">+' + (stackCount - 1) + '</div>' : '';
      const faceHtml = isP1
        ? '<circle cx="37" cy="45" r="7" fill="#fff"/><circle cx="38" cy="45" r="3.5" fill="' + faceCol + '"/><circle cx="63" cy="45" r="7" fill="#fff"/><circle cx="64" cy="45" r="3.5" fill="' + faceCol + '"/><path d="M 40 58 Q 50 68 60 58" stroke="' + faceCol + '" stroke-width="3" stroke-linecap="round" fill="none"/>'
        : '<circle cx="37" cy="45" r="7" fill="#fff"/><circle cx="38" cy="45" r="3.5" fill="' + faceCol + '"/><path d="M 58 46 Q 64 40 70 46" stroke="' + faceCol + '" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M 39 58 Q 50 72 61 58 Z" fill="' + faceCol + '"/>';

      return '<div class="cup ' + sizeClass + (isSelected ? ' selected' : '') + '">' +
        '<svg viewBox="0 0 100 115">' +
          '<defs>' +
            '<linearGradient id="grad-' + piece.id + '" x1="0" y1="0" x2="1" y2="0">' +
              '<stop offset="0%" stop-color="' + gStart + '"/>' +
              '<stop offset="40%" stop-color="' + gMid + '"/>' +
              '<stop offset="100%" stop-color="' + gEnd + '"/>' +
            '</linearGradient>' +
          '</defs>' +
          '<ellipse cx="50" cy="112" rx="46" ry="6" fill="rgba(0,0,0,0.2)"/>' +
          '<path d="M 24 16 L 8 102 C 8 107 92 107 92 102 L 76 16 Z" fill="url(#grad-' + piece.id + ')"/>' +
          '<ellipse cx="50" cy="104" rx="44" ry="7.5" fill="' + rimCol + '" stroke="' + capTop + '" stroke-width="1.2" stroke-opacity="0.5"/>' +
          '<ellipse cx="50" cy="16" rx="26" ry="6.5" fill="' + capTop + '" stroke="#fff" stroke-width="1.2"/>' +
          faceHtml +
        '</svg>' +
        '<div class="cup-badge" style="background:' + (isP1 ? 'var(--p1-dark)' : 'var(--p2-dark)') + '">' + label + '</div>' +
        stackHtml +
      '</div>';
    }

    // --- 5. UI Rendering & Interactions ---
    function render() {
      // 1. Hands
      ['1', '2'].forEach(pKey => {
        const pNum = parseInt(pKey);
        const container = document.getElementById('p' + pKey + 'Pieces');
        const pieces = gameState.hand[pNum];
        container.innerHTML = '';

        const categories = [
          { size: 1, label: '小', ids: ['s1', 's2'] },
          { size: 2, label: '中', ids: ['m1', 'm2'] },
          { size: 3, label: '大', ids: ['l1', 'l2'] }
        ];

        categories.forEach(cat => {
          const groupDiv = document.createElement('div');
          groupDiv.style.display = 'flex';
          groupDiv.style.alignItems = 'center';
          groupDiv.style.gap = '2px';
          groupDiv.style.padding = '0 1px';

          cat.ids.forEach(id => {
            const fullId = 'p' + pNum + '-' + id;
            const piece = pieces.find(p => p.id === fullId);
            const isSelected = selectedPiece && selectedPiece.source === 'hand' && selectedPiece.piece.id === fullId;

            const wrap = document.createElement('div');
            wrap.style.position = 'relative';

            if (piece) {
              wrap.innerHTML = renderCupSvg(piece, isSelected, 1);
              wrap.onclick = () => onHandPieceClick(pNum, piece);
            } else {
              const w = cat.size === 1 ? '22px' : cat.size === 2 ? '28px' : '36px';
              const h = cat.size === 1 ? '26px' : cat.size === 2 ? '32px' : '40px';
              wrap.innerHTML = '<div style="width:' + w + ';height:' + h + ';border:1px dashed #cbd5e1;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:8px;">済</div>';
            }
            groupDiv.appendChild(wrap);
          });
          container.appendChild(groupDiv);
        });
      });

      // 2. Board Cells
      const grid = document.getElementById('boardGrid');
      grid.innerHTML = '';

      for (let i = 0; i < 9; i++) {
        const cellStack = gameState.board[i];
        const topPiece = getTopPiece(cellStack);
        const cellEl = document.createElement('div');
        cellEl.className = 'cell';

        const isWinning = gameState.winningLine && gameState.winningLine.includes(i);
        if (isWinning) cellEl.classList.add('winning');

        const isLegal = selectedPiece && (selectedPiece.source !== 'board' || selectedPiece.fromIndex !== i) && canPlace(selectedPiece.piece, cellStack);
        if (isLegal && isMyCurrentTurn()) cellEl.classList.add('legal-target');

        const isSelectedBoard = selectedPiece && selectedPiece.source === 'board' && selectedPiece.fromIndex === i;

        if (topPiece) {
          cellEl.innerHTML = renderCupSvg(topPiece, isSelectedBoard, cellStack.length);
        }

        cellEl.onclick = () => onCellClick(i);
        grid.appendChild(cellEl);
      }

      // 3. Turn banner
      const badge = document.getElementById('turnBadge');
      if (gameState.currentTurn === 1) {
        badge.innerText = '先手 (青・〇)';
        badge.style.background = 'var(--p1-main)';
      } else {
        badge.innerText = gameMode === 'ai' ? 'AIの手番 (橙・✕)' : '後手 (橙・✕)';
        badge.style.background = 'var(--p2-main)';
      }

      // Hand box active styling & positioning (user hand at bottom)
      const isUserP2 = (gameMode === 'p2p' && p2pRole === 'guest');
      const h1 = document.getElementById('hand1Box');
      const h2 = document.getElementById('hand2Box');
      const bWrap = document.querySelector('.board-wrapper');

      h1.style.borderColor = gameState.currentTurn === 1 ? 'var(--p1-main)' : '#fde68a';
      h2.style.borderColor = gameState.currentTurn === 2 ? 'var(--p2-main)' : '#fde68a';

      if (bWrap) bWrap.style.order = '10';

      if (isUserP2) {
        h2.style.order = '15'; // User (Guest / P2) at bottom
        h1.style.order = '5';  // Host / P1 at top
        document.getElementById('p2Sub').innerText = 'あなた (自分の駒)';
        document.getElementById('p1Sub').innerText = '相手 (ホストの駒)';
      } else {
        h1.style.order = '15'; // User (P1) at bottom
        h2.style.order = '5';  // Opponent / AI (P2) at top
        document.getElementById('p1Sub').innerText = gameMode === 'local' ? 'プレイヤー1 (先手)' : 'あなた (自分の駒)';
        document.getElementById('p2Sub').innerText = gameMode === 'ai' ? 'AIの駒' : gameMode === 'local' ? 'プレイヤー2 (後手)' : '相手 (ゲストの駒)';
      }
    }

    function isMyCurrentTurn() {
      if (gameState.winner !== null) return false;
      if (gameMode === 'local') return true;
      if (gameMode === 'ai') return gameState.currentTurn === 1;
      if (gameMode === 'p2p') {
        if (!p2pRole) return false;
        return (p2pRole === 'host' && gameState.currentTurn === 1) || (p2pRole === 'guest' && gameState.currentTurn === 2);
      }
      return false;
    }

    function onHandPieceClick(player, piece) {
      if (!isMyCurrentTurn()) return;
      if (gameState.currentTurn !== player) return;

      if (selectedPiece && selectedPiece.source === 'hand' && selectedPiece.piece.id === piece.id) {
        selectedPiece = null;
      } else {
        selectedPiece = { source: 'hand', piece };
        playSound('select');
      }
      render();
    }

    function onCellClick(index) {
      if (!isMyCurrentTurn()) return;
      const cell = gameState.board[index];
      const top = getTopPiece(cell);

      if (selectedPiece) {
        // Attempt to place
        if (canPlace(selectedPiece.piece, cell)) {
          let action;
          if (selectedPiece.source === 'hand') {
            action = { type: 'hand', player: gameState.currentTurn, pieceId: selectedPiece.piece.id, toIndex: index };
          } else {
            if (selectedPiece.fromIndex === index) {
              selectedPiece = null;
              render();
              return;
            }
            action = { type: 'board', player: gameState.currentTurn, fromIndex: selectedPiece.fromIndex, toIndex: index };
          }

          selectedPiece = null;
          executeMove(action);
        } else {
          // If clicking own top piece, switch selection
          if (top && top.player === gameState.currentTurn) {
            selectedPiece = { source: 'board', piece: top, fromIndex: index };
            playSound('select');
            render();
          }
        }
      } else {
        // Select from board
        if (top && top.player === gameState.currentTurn) {
          selectedPiece = { source: 'board', piece: top, fromIndex: index };
          playSound('select');
          render();
        }
      }
    }

    function executeMove(action, isRemote = false) {
      gameState = applyMoveAction(gameState, action);
      playSound('place');
      render();

      if (gameMode === 'p2p' && !isRemote && p2pConn) {
        p2pConn.send({ type: 'MOVE', action });
      }

      if (gameState.winner !== null) {
        const isUserWin = (gameMode === 'ai' && gameState.winner === 1) ||
                          (gameMode === 'p2p' && ((p2pRole === 'host' && gameState.winner === 1) || (p2pRole === 'guest' && gameState.winner === 2))) ||
                          (gameMode === 'local');
        if (isUserWin) {
          playSound('win');
        } else {
          playSound('lose');
        }
        setTimeout(() => showWinModal(gameState.winner, isUserWin), 300);
        return;
      }

      // AI turn trigger
      if (gameMode === 'ai' && gameState.currentTurn === 2) {
        setTimeout(() => {
          const aiMove = computeSupremeAIMove(gameState, 2);
          if (aiMove) executeMove(aiMove);
        }, 400);
      }
    }

    function showWinModal(winner, isUserWin) {
      const modal = document.getElementById('winModal');
      const box = modal.querySelector('.modal-box');
      const emoji = document.getElementById('winEmoji');
      const title = document.getElementById('winTitle');
      const desc = document.getElementById('winDesc');
      const btn = document.getElementById('winRestartBtn');

      if (!isUserWin) {
        box.classList.add('defeat');
        emoji.innerText = '💀';
        title.innerText = gameMode === 'ai' ? '💀 敗北... AIの勝利' : '💀 敗北... 相手の勝利';
        desc.innerText = gameMode === 'ai'
          ? 'AIの深層読みにしてやられました。相手のコップの下に隠れていたコマを意識してリベンジしましょう！'
          : '相手の見事な指し手にしてやられました。次は負けられません！';
        btn.innerText = '🔥 リベンジする（もう一度）';
      } else {
        box.classList.remove('defeat');
        emoji.innerText = '🏆';
        if (gameMode === 'ai') {
          title.innerText = '🎉 あなたの完全勝利！';
          desc.innerText = '見事、AIの深層読みを打ち破りました！素晴らしい戦術眼です！';
        } else {
          title.innerText = '🎉 ' + (winner === 1 ? '先手 (青・〇)' : '後手 (橙・✕)') + ' の勝利！';
          desc.innerText = '見事3つの紙コップを一列に揃えました！';
        }
        btn.innerText = 'もう一局あそぶ';
      }
      modal.style.display = 'flex';
    }

    function closeModalAndReset() {
      document.getElementById('winModal').style.display = 'none';
      resetGame();
    }

    function closeModalAndReturnToOpening() {
      document.getElementById('winModal').style.display = 'none';
      if (p2pConn) {
        try { p2pConn.close(); } catch (e) {}
      }
      resetGame(false);
      returnToOpening();
    }

    function resetGame(syncRemote = true) {
      gameState = {
        board: [[], [], [], [], [], [], [], [], []],
        hand: {
          1: [
            { id: 'p1-s1', player: 1, size: 1 }, { id: 'p1-s2', player: 1, size: 1 },
            { id: 'p1-m1', player: 1, size: 2 }, { id: 'p1-m2', player: 1, size: 2 },
            { id: 'p1-l1', player: 1, size: 3 }, { id: 'p1-l2', player: 1, size: 3 }
          ],
          2: [
            { id: 'p2-s1', player: 2, size: 1 }, { id: 'p2-s2', player: 2, size: 1 },
            { id: 'p2-m1', player: 2, size: 2 }, { id: 'p2-m2', player: 2, size: 2 },

      document.querySelectorAll('.mode-btn')[btnIdx].classList.add('active');

      const p2pPanel = document.getElementById('p2pPanel');
      p2pPanel.style.display = mode === 'p2p' ? 'flex' : 'none';

    function p2pCreateRoom() {
      const id = 'ox-' + Math.random().toString(36).substr(2, 6);
      p2pRole = 'host';
      myRoomId = id;

      p2pPeer = new Peer(id);
      p2pPeer.on('open', (peerId) => {
        document.getElementById('p2pSetupRow').style.display = 'none';
        document.getElementById('p2pInfoRow').style.display = 'flex';
        document.getElementById('p2pStatusText').innerText = '相手の参加を待機中 (ID: ' + peerId + ')';
      });

      p2pPeer.on('connection', (conn) => {
        p2pConn = conn;
        setupP2PConnection();
      });
    }

    function p2pJoinRoom() {
      const target = document.getElementById('joinRoomInput').value.trim();
      if (!target) return alert('ルームIDを入力してください');
      p2pRole = 'guest';

      p2pPeer = new Peer();
      p2pPeer.on('open', () => {
        p2pConn = p2pPeer.connect(target);
        setupP2PConnection();
      });
    }

    function setupP2PConnection() {
      p2pConn.on('open', () => {
        document.getElementById('p2pSetupRow').style.display = 'none';
        document.getElementById('p2pInfoRow').style.display = 'flex';
        document.getElementById('p2pStatusText').innerText = '🟢 対戦相手と接続完了！';
      });

      p2pConn.on('data', (data) => {
        if (data.type === 'MOVE') {
          executeMove(data.action, true);
        } else if (data.type === 'RESET') {
          resetGame(false);
        }
      });

      p2pConn.on('close', () => {
        alert('対戦相手が切断しました');
        switchMode('local');
      });
    }

    function copyRoomId() {
      if (!myRoomId) return;
      navigator.clipboard.writeText(myRoomId).then(() => alert('ルームIDをコピーしました: ' + myRoomId));
    }
